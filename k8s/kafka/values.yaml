# Bitnami Kafka chart — KRaft mode, single broker, no auth (internal cluster only)
kraft:
  enabled: true

replicaCount: 1

listeners:
  client:
    protocol: PLAINTEXT
  controller:
    protocol: PLAINTEXT
  interbroker:
    protocol: PLAINTEXT

service:
  type: ClusterIP
  ports:
    client: 9092

persistence:
  enabled: true
  size: 8Gi

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

zookeeper:
  enabled: false

extraConfig: |
  auto.create.topics.enable=false
  log.retention.hours=24
  offsets.topic.replication.factor=1
  transaction.state.log.replication.factor=1
  transaction.state.log.min.isr=1