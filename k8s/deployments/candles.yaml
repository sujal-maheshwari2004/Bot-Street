apiVersion: apps/v1
kind: Deployment
metadata:
  name: candles
  namespace: bot-street
spec:
  replicas: 1
  selector:
    matchLabels:
      app: candles
  template:
    metadata:
      labels:
        app: candles
    spec:
      containers:
      - name: candles
        image: us-central1-docker.pkg.dev/bot-street/bot-street/bot-street:v2
        env:
        - name: SERVICE
          value: candles
        - name: BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: bot-street-config
              key: BOOTSTRAP_SERVERS
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: bot-street-secrets
              key: MONGO_URI
        - name: MONGO_DB
          valueFrom:
            configMapKeyRef:
              name: bot-street-config
              key: MONGO_DB
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          exec:
            command: ["python", "-c", "import sys; sys.exit(0)"]
          initialDelaySeconds: 15
          periodSeconds: 30

