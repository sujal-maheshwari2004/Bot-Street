apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: bot-street
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger
  template:
    metadata:
      labels:
        app: ledger
    spec:
      containers:
      - name: ledger
        image: gcr.io/YOUR_PROJECT/bot-street:latest
        env:
        - name: SERVICE
          value: ledger
        - name: BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: bot-street-config
              key: BOOTSTRAP_SERVERS
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: bot-street-secrets
              key: MONGO_URI
        - name: MONGO_DB
          valueFrom:
            configMapKeyRef:
              name: bot-street-config
              key: MONGO_DB
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          exec:
            command: ["python", "-c", "import sys; sys.exit(0)"]
          initialDelaySeconds: 15
          periodSeconds: 30