apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: bot-street
data:
  server.properties: |
    process.roles=broker,controller
    node.id=1
    controller.quorum.voters=1@kafka-0.kafka-headless.bot-street.svc.cluster.local:9093
    listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
    advertised.listeners=PLAINTEXT://kafka-0.kafka-headless.bot-street.svc.cluster.local:9092
    listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
    controller.listener.names=CONTROLLER
    inter.broker.listener.name=PLAINTEXT
    log.dirs=/var/lib/kafka/data/kafka-logs
    num.partitions=5
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1
    auto.create.topics.enable=false
    log.retention.hours=24
    group.initial.rebalance.delay.ms=0
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: bot-street
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
  - name: client
    port: 9092
  - name: controller
    port: 9093
---
apiVersion: v1
kind: Service
metadata:
  name: bot-street-kafka
  namespace: bot-street
spec:
  selector:
    app: kafka
  ports:
  - name: client
    port: 9092
    targetPort: 9092
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: bot-street
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      volumes:
      - name: kafka-config
        configMap:
          name: kafka-config
      initContainers:
      - name: init-kafka
        image: confluentinc/cp-kafka:7.6.0
        command:
        - /bin/bash
        - -c
        - |
          mkdir -p /var/lib/kafka/data/kafka-logs
          if [ ! -f /var/lib/kafka/data/kafka-logs/meta.properties ]; then
            CLUSTER_ID=$(kafka-storage random-uuid)
            kafka-storage format -t $CLUSTER_ID -c /etc/kafka/server.properties
          fi
        env:
        - name: KAFKA_OPTS
          value: ""
        volumeMounts:
        - name: kafka-data
          mountPath: /var/lib/kafka/data
        - name: kafka-config
          mountPath: /etc/kafka/server.properties
          subPath: server.properties
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.6.0
        command:
        - /bin/bash
        - -c
        - kafka-server-start /etc/kafka/server.properties
        ports:
        - containerPort: 9092
          name: client
        - containerPort: 9093
          name: controller
        env:
        - name: KAFKA_HEAP_OPTS
          value: "-Xmx512m -Xms256m"
        - name: KAFKA_OPTS
          value: ""
        volumeMounts:
        - name: kafka-data
          mountPath: /var/lib/kafka/data
        - name: kafka-config
          mountPath: /etc/kafka/server.properties
          subPath: server.properties
        readinessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 60
          periodSeconds: 20
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
  volumeClaimTemplates:
  - metadata:
      name: kafka-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 8Gi